version: "3.8"

services:
  api1:
    image: ghcr.io/bentoplebstguida/rinha-fraud-api:optim-6000-e724a2e
    platform: linux/amd64
    container_name: api1
    expose:
      - "8080"
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    networks:
      - fraud-net

  api2:
    image: ghcr.io/bentoplebstguida/rinha-fraud-api:optim-6000-e724a2e
    platform: linux/amd64
    container_name: api2
    expose:
      - "8080"
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    networks:
      - fraud-net

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "70MB"
    networks:
      - fraud-net
    depends_on:
      - api1
      - api2

networks:
  fraud-net:
    driver: bridge
