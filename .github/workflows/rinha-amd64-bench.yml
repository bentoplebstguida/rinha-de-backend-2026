name: rinha-amd64-bench

on:
  workflow_dispatch:
  push:
    branches: [IaSlop, main]
    paths:
      - 'api/**'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'docker-compose.nginx.yml'
      - 'nginx/**'
      - 'test/**'
      - '.github/workflows/rinha-amd64-bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install k6 v2.0.0
        run: |
          curl -sSL -o /tmp/k6.tar.gz "https://github.com/grafana/k6/releases/download/v2.0.0/k6-v2.0.0-linux-amd64.tar.gz"
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v2.0.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Install Python accuracy harness deps
        run: |
          python3 -m pip install --quiet --break-system-packages requests 2>&1 | tail -3

      - name: Download official test data
        run: |
          curl -sSL -o /tmp/rinha-test-data.json \
            "https://raw.githubusercontent.com/zanfranceschi/rinha-de-backend-2026/main/test/test-data.json"
          ls -la /tmp/rinha-test-data.json

      - name: Build api image (single, reused for both variants)
        run: |
          docker compose -f docker-compose.local.yml build api1 api2 lb
          docker compose -f docker-compose.nginx.yml build || true

      - name: BENCH A - LB Go (Unix sockets) baseline
        run: |
          docker compose -f docker-compose.local.yml up -d
          sleep 3
          docker compose -f docker-compose.local.yml ps
          curl -sS http://localhost:19999/ready || (echo "A: ready failed"; exit 1)

          k6 run --summary-export=test/A-lbgo-summary.json test/load-stable.js 2>&1 | tail -15
          python3 test/accuracy.py --url http://localhost:19999 --workers 64 --out test/A-lbgo-accuracy.json 2>&1 | tail -15

          docker compose -f docker-compose.local.yml down || true

      - name: BENCH B - nginx LB (HTTP/1.1 keep-alive)
        run: |
          docker compose -f docker-compose.nginx.yml up -d
          sleep 5
          docker compose -f docker-compose.nginx.yml ps
          docker compose -f docker-compose.nginx.yml logs --no-color || true
          echo "---direct curl---"
          curl -sS -m 3 http://localhost:19998/ready || (echo "B: ready failed"; exit 1)

          k6 run --summary-export=test/B-nginx-summary.json test/load-stable.js 2>&1 | tail -15
          python3 test/accuracy.py --url http://localhost:19998 --workers 64 --out test/B-nginx-accuracy.json 2>&1 | tail -15

          docker compose -f docker-compose.nginx.yml down || true

      - name: Compare results
        if: always()
        run: |
          cd test
          python3 compare.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            test/A-*.json
            test/B-*.json
