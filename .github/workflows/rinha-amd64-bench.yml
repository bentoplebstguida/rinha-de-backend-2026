name: rinha-amd64-bench

on:
  workflow_dispatch:
  push:
    branches: [IaSlop, main]
    paths:
      - 'api/**'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'docker-compose.nginx.yml'
      - 'nginx/**'
      - 'test/**'
      - '.github/workflows/rinha-amd64-bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install k6 v2.0.0
        run: |
          curl -sSL -o /tmp/k6.tar.gz "https://github.com/grafana/k6/releases/download/v2.0.0/k6-v2.0.0-linux-amd64.tar.gz"
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v2.0.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Download official test data (54,100 labeled entries)
        run: |
          curl -sSL -o test/test-data.json \
            "https://raw.githubusercontent.com/zanfranceschi/rinha-de-backend-2026/main/test/test-data.json"
          ls -la test/test-data.json

      - name: BENCH - nginx LB + 2 API Go (matches submission architecture)
        run: |
          docker compose -f docker-compose.nginx.yml up -d --build
          sleep 4
          docker compose -f docker-compose.nginx.yml ps
          curl -sS -m 3 http://localhost:19998/ready || (echo "ready failed"; docker compose -f docker-compose.nginx.yml logs; exit 1)

          echo "--- k6 official ramp (matches Rinha engine) ---"
          cd test
          k6 run --summary-export=k6-summary-export.json rinha-official.js 2>&1 | tail -40

          # handleSummary writes to 'test/results.json' relative to k6's CWD
          if [ -f test/results.json ]; then
            mv test/results.json results.json
            ls -la results.json
          fi
          cd ..

          echo "--- official results.json ---"
          cat test/results.json 2>/dev/null

          docker compose -f docker-compose.nginx.yml down || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rinha-results
          path: |
            test/results.json
            test/k6-summary-export.json
