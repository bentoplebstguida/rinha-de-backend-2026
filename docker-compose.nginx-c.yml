services:
  api1:
    image: rinha-c:c-20260604-0529
    platform: linux/amd64
    container_name: rinha-nginx-c-api1
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "140MB"

  api2:
    image: rinha-c:c-20260604-0529
    platform: linux/amd64
    container_name: rinha-nginx-c-api2
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "140MB"

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: rinha-nginx-c-lb
    ports:
      - "19998:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "70MB"
