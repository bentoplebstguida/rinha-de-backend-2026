name: build-and-push-optim-6000

on:
  workflow_dispatch:
  push:
    branches: [submission]
    paths:
      - 'api/**'
      - 'docker-compose.yml'
      - 'nginx/**'

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "image_tag=optim-6000-${short_sha}" >> $GITHUB_OUTPUT

      - name: Build and push Go image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bentoplebstguida/rinha-fraud-api:${{ steps.meta.outputs.image_tag }}
            ghcr.io/bentoplebstguida/rinha-fraud-api:optim-6000-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
