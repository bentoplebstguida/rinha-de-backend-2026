version: "3.8"

# Local benchmark stack (not the submission).
# Mirrors the architecture from commit 7f08aa4: 1 LB Go (round-robin) + 2 API Go via Unix sockets.
# Used by .github/workflows/rinha-amd64-bench.yml and by local arm64 testing on Mac M-series.

services:
  api1:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: rinha-local-api1
    environment:
      - MODE=api
      - SOCKET_PATH=/sockets/api1.sock
    volumes:
      - rinha_local_sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: rinha-local-api2
    environment:
      - MODE=api
      - SOCKET_PATH=/sockets/api2.sock
    volumes:
      - rinha_local_sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: rinha-local-lb
    ports:
      - "19999:9999"
    environment:
      - MODE=lb
      - SOCKETS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - rinha_local_sockets:/sockets:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    depends_on:
      - api1
      - api2

volumes:
  rinha_local_sockets:
