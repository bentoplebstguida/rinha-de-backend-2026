version: "3.8"

services:
  api1:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: api1
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "140MB"
    networks:
      - fraud-net

  api2:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: api2
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "140MB"
    networks:
      - fraud-net

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "70MB"
    networks:
      - fraud-net
    depends_on:
      - api1
      - api2

networks:
  fraud-net:
    driver: bridge
