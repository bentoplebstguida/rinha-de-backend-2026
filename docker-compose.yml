version: "3.8"

services:
  api1:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: api1
    network_mode: host
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "140MB"

  api2:
    build:
      context: ./api
      platforms:
        - linux/amd64
    container_name: api2
    network_mode: host
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "140MB"

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "70MB"
    depends_on:
      - api1
      - api2
